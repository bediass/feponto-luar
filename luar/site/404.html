<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Página não encontrada — Luar Acessórios</title>
<meta name="description" content="A página que você procurou não existe ou foi movida. Volte ao início ou veja os produtos da Luar Acessórios." />
<meta name="robots" content="noindex, follow" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  /* Tokens espelhados de assets/estilo.css — a 404 é autossuficiente de propósito:
     não depende do JS de nav/catálogo, que precisa do Supabase pra montar.
     Regra de ouro da marca: dourado NUNCA como cor de texto. Botão dourado = texto near-black. */
  :root {
    --champagne:      #bd9f7b;
    --champagne-dark: #a0855f;
    --ink:            #221f1b;
    --ink-2:          #7a746b;
    --white:          #ffffff;
    --line:           #e7e0d4;
    --font-head: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --r-md: 6px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  html { color-scheme: light; -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* env() no recuo horizontal: a página declara viewport-fit=cover, e em
       celular com notch deitado o entalhe come ~44px da lateral — mais que o
       padding mínimo de 20px. Sem isto o texto passa por baixo do entalhe. */
    padding: 3rem calc(clamp(1.25rem, 5vw, 3rem) + env(safe-area-inset-right))
             3rem calc(clamp(1.25rem, 5vw, 3rem) + env(safe-area-inset-left));
    background: var(--white);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: 32rem; text-align: center; }

  a { touch-action: manipulation; -webkit-tap-highlight-color: rgba(189, 159, 123, 0.2); }

  .logo { display: block; width: 120px; margin: 0 auto 2.75rem; }
  .logo img { width: 100%; height: auto; display: block; }

  .codigo {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 1rem;
  }

  h1 {
    font-family: var(--font-head);
    font-weight: 500;
    font-size: clamp(1.875rem, 5.5vw, 2.75rem);
    line-height: 1.15;
    margin-bottom: 1rem;
    text-wrap: balance;
  }

  p.texto {
    color: var(--ink-2);
    margin-bottom: 2.25rem;
    text-wrap: pretty;
  }

  .acoes {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 1.5rem;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    font-size: 0.9375rem;
    font-weight: 500;
    text-decoration: none;
    color: var(--ink);
    background: var(--white);
    transition: background-color 240ms var(--ease), border-color 240ms var(--ease);
  }

  .btn--primario {
    background: var(--champagne);
    border-color: var(--champagne);
    color: var(--ink);
  }

  .btn:hover { border-color: var(--champagne); }
  .btn--primario:hover { background: var(--champagne-dark); border-color: var(--champagne-dark); }

  a:focus-visible {
    outline: 2px solid var(--champagne-dark);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
<!-- Medição de audiência (GA4). No <head> e não no fim do <body> de
     propósito: quem entra e sai em 2 segundos precisa ser contado, e o
     `defer` garante que isso não atrasa a renderização. O ID mora só
     dentro do analytics.js. -->
<script src="assets/analytics.js" defer></script>
</head>
<body>

<main>
  <a class="logo" href="index.html" aria-label="Luar Acessórios — voltar ao início">
    <img src="assets/logo-luar.png" alt="Luar Acessórios" width="1265" height="783" fetchpriority="high" />
  </a>

  <p class="codigo">Erro 404</p>

  <h1>Esta página não existe</h1>

  <p class="texto">O endereço que você acessou não está mais disponível ou foi digitado de forma diferente. Nossos produtos continuam a um clique.</p>

  <div class="acoes">
    <a class="btn btn--primario" href="index.html">Voltar ao início</a>
    <a class="btn" href="loja.html">Ver produtos</a>
  </div>
</main>

</body>
</html>
