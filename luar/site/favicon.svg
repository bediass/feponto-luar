<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Luar Acessórios">
  <!--
    Favicon da Luar Acessorios.
    Conceito vem do design-guide: "Luar = luz da lua", e o "u" do logotipo e
    desenhado como lua crescente. Em 16px o logotipo escrito vira borrao, entao
    o favicon usa so a lua, que e o simbolo que sobrevive ao tamanho.
    Cores do guia: fundo near-black #221F1B, lua em Fendi #BD9F7B.
    Dourado sobre branco daria contraste ~2.5:1 e sumiria na aba clara; sobre
    o near-black passa folgado e o tile fica visivel em aba clara e escura.
  -->
  <defs>
    <mask id="lua">
      <rect width="64" height="64" fill="#000"/>
      <circle cx="30" cy="32" r="19" fill="#fff"/>
      <circle cx="41" cy="24" r="16.5" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#221F1B"/>
  <rect width="64" height="64" fill="#BD9F7B" mask="url(#lua)"/>
</svg>
