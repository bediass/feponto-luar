<!DOCTYPE html>
<!--
  PÁGINA-LÁPIDE. Não é uma página de verdade — é o túmulo da consulta de pedido.

  A compra online foi desligada em 31/07/2026 e esta tela (que consultava o
  pedido por código + e-mail) foi apagada junto. Só que a Cloudflare tinha
  cacheado /pedido na borda com s-maxage de 7 dias, e um deploy novo não
  invalida o que deixou de existir: quem tivesse o link antigo continuava
  vendo a tela de consulta (quebrada) por vários dias.

  Em vez de esperar o cache expirar, o endereço voltou a existir — dizendo a
  coisa certa. Vale também pra link antigo salvo, print no WhatsApp e resultado
  velho do Google.

  Autossuficiente de propósito: nada de assets/loja.js (que precisa do Supabase
  pra montar) e nada de <script> — o CSP em _headers não tem 'unsafe-inline'
  pra script. Só HTML e um <style> local.

  Se um dia a Luar voltar a vender online, este arquivo é o que precisa sair.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Acompanhe seu pedido pelo WhatsApp — Luar Acessórios</title>
<meta name="description" content="A consulta de pedido pelo site saiu do ar. Fale com a Luar Acessórios no WhatsApp para saber o status e o código de rastreio." />
<meta name="robots" content="noindex, follow" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  /* Tokens espelhados de assets/estilo.css — ver o porquê no comentário do topo.
     Regra de ouro da marca: dourado NUNCA como cor de texto. Botão dourado = texto near-black. */
  :root {
    --champagne:      #bd9f7b;
    --champagne-dark: #a0855f;
    --ink:            #221f1b;
    --ink-2:          #7a746b;
    --white:          #ffffff;
    --line:           #e7e0d4;
    --font-head: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --r-md: 6px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  html { color-scheme: light; -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* env() no recuo horizontal: a página declara viewport-fit=cover, e em
       celular com notch deitado o entalhe come ~44px da lateral — mais que o
       padding mínimo de 20px. Sem isto o texto passa por baixo do entalhe. */
    padding: 3rem calc(clamp(1.25rem, 5vw, 3rem) + env(safe-area-inset-right))
             3rem calc(clamp(1.25rem, 5vw, 3rem) + env(safe-area-inset-left));
    background: var(--white);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: 34rem; text-align: center; }

  a { touch-action: manipulation; -webkit-tap-highlight-color: rgba(189, 159, 123, 0.2); }

  .logo { display: block; width: 120px; margin: 0 auto 2.75rem; }
  .logo img { width: 100%; height: auto; display: block; }

  .codigo {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 1rem;
  }

  h1 {
    font-family: var(--font-head);
    font-weight: 500;
    font-size: clamp(1.875rem, 5.5vw, 2.75rem);
    line-height: 1.15;
    margin-bottom: 1rem;
    text-wrap: balance;
  }

  p.texto {
    color: var(--ink-2);
    margin-bottom: 2.25rem;
    text-wrap: pretty;
  }

  .acoes {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    min-height: 48px;
    padding: 0 1.5rem;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    font-size: 0.9375rem;
    font-weight: 500;
    text-decoration: none;
    color: var(--ink);
    background: var(--white);
    transition: background-color 240ms var(--ease), border-color 240ms var(--ease);
  }

  .btn svg { width: 18px; height: 18px; flex: none; }

  .btn--primario {
    background: var(--champagne);
    border-color: var(--champagne);
    color: var(--ink);
  }

  .btn:hover { border-color: var(--champagne); }
  .btn--primario:hover { background: var(--champagne-dark); border-color: var(--champagne-dark); }

  a:focus-visible {
    outline: 2px solid var(--champagne-dark);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>

<main>
  <a class="logo" href="index.html" aria-label="Luar Acessórios — voltar ao início">
    <img src="assets/logo-luar.png" alt="Luar Acessórios" width="1265" height="783" fetchpriority="high" />
  </a>

  <p class="codigo">Acompanhar pedido</p>

  <h1>A consulta agora é no WhatsApp</h1>

  <p class="texto">Esta página saiu do ar. Para saber o status do seu pedido ou o código de rastreio, é só chamar a gente no WhatsApp — respondemos com a informação na hora, sem código nem senha.</p>

  <div class="acoes">
    <a class="btn btn--primario" href="https://wa.me/5531994490804?text=Ol%C3%A1!%20Preciso%20de%20ajuda%20com%20um%20pedido%20que%20fiz." target="_blank" rel="noopener">

      Falar no WhatsApp
    </a>
    <a class="btn" href="loja.html">Ver produtos</a>
  </div>
</main>

</body>
</html>
